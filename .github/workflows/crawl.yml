name: Weekly Question Bank Crawl

on:
  # 每周一/三/五 UTC 02:00（北京时间 10:00）执行。
  # 每次 Actions 运行都换新 runner IP → 各自带一份服务器内容预算（~300 题/IP，2026-10-22 实测），
  # 配合科目轮转（PR#8）每周三科轮流吃到预算；预检 + 守卫保证被封时秒级红灯、零写入。
  schedule:
    - cron: '0 2 * * 1'
    - cron: '0 2 * * 3'
    - cron: '0 2 * * 5'
  # 支持手动触发
  workflow_dispatch:

env:
  R2_BUCKET: question-bank
  STUDENT_NUMS: ${{ secrets.STUDENT_NUMS }}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 海外连通性预检：马院服务器 2026-10-18 起屏蔽海外 IP（GitHub runner 全超时，
      # 本地正常）。观察期方案 C：被封时几秒内快速失败并明确标注，
      # 不再空烧 npm install + 60 次登录超时的 Actions 分钟数；解封后自动恢复爬取。
      - name: 海外连通性预检（马院服务器）
        run: |
          HOST=222.73.57.153
          PORT=6571
          if timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
            echo "✅ 马院服务器 $HOST:$PORT 从 runner 可达，继续爬取"
          else
            echo "::error file=scripts/pipeline.js::马院服务器 $HOST:$PORT 从 runner 不可达（海外 IP 封禁疑似持续，观察期方案 C）——本次跳过爬取，解封后将自动恢复"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # CVE-2026-111497（Brotli 解码器越界写，22.x 受影响）：固定到修复版，不再浮动
          node-version: '22.23.4'

      - name: Install dependencies
        run: npm install

      - name: Pull latest changes before pipeline
        run: git pull --rebase origin main

      - name: Run pipeline
        env:
          STUDENT_NUMS: ${{ secrets.STUDENT_NUMS }}
        run: node scripts/pipeline.js

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动更新题库数据 ${{ github.event_name == 'schedule' && '定时任务' || '手动触发' }}"
          file_pattern: 'new/** merge/**'

      # ====== 上传数据到 Cloudflare R2 ======
      - name: Setup Wrangler
        if: success()
        run: npm install -g wrangler

      - name: Upload rewrite data to R2
        if: success()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 上传 rewrite 目录下所有 JSON 文件到 R2
          for file in new/rewrite/*.json; do
            filename=$(basename "$file")
            echo "上传 $filename → R2"
            wrangler r2 object put "$R2_BUCKET/rewrite/$filename" --file "$file" --content-type "application/json" --cache-control "public, max-age=86400"
          done

      - name: Upload exam data to R2
        if: success()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 上传 cura 目录（如果存在且有 JSON 文件）
          if [ -d "cura" ] && ls cura/*.json 1>/dev/null 2>&1; then
            for file in cura/*.json; do
              filename=$(basename "$file")
              echo "上传 $filename → R2"
              wrangler r2 object put "$R2_BUCKET/cura/$filename" --file "$file" --content-type "application/json" --cache-control "public, max-age=86400"
            done
          else
            echo "cura 目录不存在或无 JSON 文件，跳过上传"
          fi

      - name: Update version manifest
        if: success()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 生成版本清单文件，用于 Vue 端检查数据是否有更新
          DATE=$(date +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"version\":\"$DATE\",\"updated\":\"$DATE\"}" > version.json
          wrangler r2 object put "$R2_BUCKET/version.json" --file version.json --content-type "application/json" --cache-control "public, max-age=300"
          echo "版本清单已更新: $DATE"
